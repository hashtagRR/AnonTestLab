[project]
name = "anontestlab"
version = "0.3.0"
description = "A simulation and experimentation framework for evaluating anonymous communication network designs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.23",
    "cryptography>=42.0",
]

[project.scripts]
atl = "anontestlab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
dashboard = ["fastapi>=0.100", "uvicorn>=0.23", "httpx2"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anontestlab*"]
