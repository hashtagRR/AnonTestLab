[project]
name = "anontestlab"
version = "0.3.0"
description = "A simulation and experimentation framework for evaluating anonymous communication network designs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.23",
    "cryptography>=42.0",
]

[project.scripts]
atl = "anontestlab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.11"]
dashboard = ["fastapi>=0.100", "uvicorn>=0.23", "httpx2"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anontestlab*"]

[tool.ruff]
target-version = "py39"  # matches requires-python: keeps pyupgrade suggestions
# from assuming syntax (e.g. the 3.10+ `X | Y` union operator at runtime)
# that isn't safe on the floor this project declares support for.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "BLE", "RUF"]
