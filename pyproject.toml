[project]
name = "anontestlab"
version = "0.5.2"
description = "A simulation and experimentation framework for evaluating anonymous communication network designs"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["anonymity", "anonymous communication", "tor", "mixnet", "traffic correlation", "network emulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.23",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://hashtagRR.github.io/AnonTestLab"
Source = "https://github.com/hashtagRR/AnonTestLab"
Issues = "https://github.com/hashtagRR/AnonTestLab/issues"
Changelog = "https://github.com/hashtagRR/AnonTestLab/blob/main/CHANGELOG.md"

[project.scripts]
atl = "anontestlab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.11"]
# matplotlib draws the dashboard's PDF reports (anontestlab/dashboard/report.py).
dashboard = ["fastapi>=0.100", "uvicorn>=0.23", "httpx", "matplotlib>=3.5"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anontestlab*"]

[tool.setuptools.package-data]
"anontestlab.dashboard" = ["static/*"]

[tool.ruff]
target-version = "py39"  # matches requires-python: keeps pyupgrade suggestions
# from assuming syntax (e.g. the 3.10+ `X | Y` union operator at runtime)
# that isn't safe on the floor this project declares support for.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "BLE", "RUF"]
